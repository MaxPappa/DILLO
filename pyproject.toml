[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dillo"
version = "0.1.0"
description = "DILLO training and evaluation code for LIBERO policy explanation."
requires-python = ">=3.10"
dependencies = [
    "accelerate",
    "easydict",
    "huggingface-hub",
    "numpy<2",
    "opencv-python<5",
    "openai",
    "peft",
    "pillow",
    "pyyaml",
    "torch",
    "torchvision",
    "tqdm",
    "transformers",
    "wandb",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
serve = [
    "vllm",
]

[tool.setuptools.packages.find]
include = ["dillo*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
