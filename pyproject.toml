[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dillo"
version = "0.1.0"
description = "DILLO training and evaluation code for LIBERO policy explanation."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["dillo*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

